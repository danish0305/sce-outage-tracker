name: Scrape Azusa outages (watcher)

on:
  schedule:
    # Off-peak, staggered minutes (UTC) so no two utility workflows push in the same minute.
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Per-utility group: serialises this workflow with itself without letting the other
# utilities' queued runs get cancelled (a shared group would do exactly that).
concurrency:
  group: scrape-azusa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ---- auto-stop guard -------------------------------------------------
      # GitHub cron has no end date. After the deadline this step still SUCCEEDS
      # (exit 0) but sets expired=true and every real step below is skipped, so
      # post-deadline runs show as green with skipped steps -- never red.
      - name: Check auto-stop deadline (2026-09-30T14:00:00Z == 10:00 AM EDT 2026-08-28)
        id: deadline
        run: |
          DEADLINE_UTC="2026-09-30T14:00:00Z"
          now=$(date -u +%s)
          dl=$(date -u -d "$DEADLINE_UTC" +%s)
          echo "Now (UTC):      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deadline (UTC): $DEADLINE_UTC"
          if [ "$now" -ge "$dl" ]; then
            echo "Past deadline - skipping scrape (green success, steps skipped)."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "Before deadline - proceeding."
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deadline.outputs.expired != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.deadline.outputs.expired != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.deadline.outputs.expired != 'true'
        run: pip install -r requirements.txt

      - name: Scrape Azusa (DataVoice; appends only when an outage exists)
        if: steps.deadline.outputs.expired != 'true'
        run: |
          python datavoice_outages.py --client azusa


      - name: Commit updated CSVs
        if: steps.deadline.outputs.expired != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes this run."
            exit 0
          fi
          git commit -m "data: azusa outages @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Rebase onto the latest remote before every push attempt; retry the race.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "::error::Rebase conflict on attempt ${attempt} - aborting to avoid data loss."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (remote advanced) on attempt ${attempt}; re-syncing..."
            sleep $((3 + RANDOM % 8))
          done
          echo "::error::Push still failing after 5 attempts."
          exit 1
