name: Scrape SCE outages (LA + OC)

on:
  # Scheduled trigger REMOVED on 2026-08-29: all utilities now run from the single
  # consolidated workflow scrape-all.yml, so the repo has exactly ONE cron instead of
  # 8 competing ones. Kept dispatch-only so this utility can still be run on demand.
  workflow_dispatch: {}

# Let the default GITHUB_TOKEN push the updated CSVs back.
permissions:
  contents: write

# Serialize runs on the same branch so two scrapes can never push at once.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # --- Auto-stop guard ---------------------------------------------------
      # GitHub cron has no built-in end date, so we gate the job on a deadline.
      # Deadline: Tuesday 2026-09-29 3:00 PM Eastern (EDT, UTC-4) = 14:00:00 UTC.
      # (Late August is EDT, so 10:00 local == 14:00Z; literal EST would be 15:00Z.)
      # After that, this step still succeeds (exit 0) but sets expired=true, and
      # every real step below is skipped via `if:`. The run therefore shows as a
      # GREEN success with skipped steps -- never a red failure -- after cutoff.
      - name: Check auto-stop deadline (2026-09-29 15:00 EDT = 19:00 UTC)
        id: deadline
        run: |
          DEADLINE_UTC="2026-09-29T19:00:00Z"
          now=$(date -u +%s)
          dl=$(date -u -d "$DEADLINE_UTC" +%s)
          echo "Now (UTC):      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deadline (UTC): $DEADLINE_UTC"
          if [ "$now" -ge "$dl" ]; then
            echo "Past deadline — skipping scrape (green success, steps skipped)."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "Before deadline — proceeding with scrape."
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deadline.outputs.expired != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the pre-push rebase is reliable

      - name: Set up Python
        if: steps.deadline.outputs.expired != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.deadline.outputs.expired != 'true'
        run: pip install -r requirements.txt

      - name: Scrape outages (active + scheduled)
        if: steps.deadline.outputs.expired != 'true'
        run: |
          python sce_oc_outages.py --counties "ORANGE,LOS ANGELES" \
            --out la_oc_outages_latest.csv \
            --history la_oc_outages_history.csv

      - name: Scrape PSPS
        if: steps.deadline.outputs.expired != 'true'
        run: |
          python sce_oc_psps.py --counties "ORANGE,LOS ANGELES" \
            --out la_oc_psps_latest.csv \
            --history la_oc_psps_history.csv

      - name: Commit updated CSVs
        if: steps.deadline.outputs.expired != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No data changes this run — nothing to commit."
            exit 0
          fi
          git commit -m "data: update LA+OC outages @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Rebase onto the latest remote BEFORE each push, then push. If the remote
          # advanced between our fetch and push (a race), the push is rejected and we
          # retry. A genuine rebase conflict (should never happen for append-only CSVs)
          # fails the job loudly instead of silently dropping data.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict on attempt ${attempt} — aborting to avoid data loss."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (remote advanced) on attempt ${attempt}; re-syncing and retrying…"
            sleep 3
          done
          echo "::error::Push still failing after 5 attempts."
          exit 1
